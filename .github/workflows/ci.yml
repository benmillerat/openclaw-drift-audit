name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
          - 26

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Run behavior tests
        run: npm test

      - name: Check JavaScript syntax
        run: find scripts -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Validate deterministic skill inventory
        run: node scripts/fingerprint-skill.mjs --root .

      - name: Verify tests left the repository unchanged
        run: git diff --exit-code
